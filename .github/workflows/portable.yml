name: Native port integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfontconfig1 libice6 libsm6 playerctl python3-dbus-next xvfb xdotool desktop-file-utils at-spi2-core python3-pyatspi python3-dbus
      - name: Build desktop
        run: dotnet publish desktop -c Release --no-self-contained -o artifacts/desktop
      - name: Build native camera and verify synthetic transport
        run: bash desktop/native/build.sh artifacts/desktop
      - name: Desktop and module checks (no hardware)
        run: dotnet artifacts/desktop/TokenDock.dll --check artifacts/desktop-renders
      - name: Synthetic switching performance and allocation evidence
        run: dotnet artifacts/desktop/TokenDock.dll --perf-check artifacts/performance.json
      - name: Linux music integration (isolated D-Bus fixture)
        if: runner.os == 'Linux'
        run: dbus-run-session -- /usr/bin/python3 desktop/native/mpris-fixture.py artifacts/desktop/TokenDock.dll
      - name: macOS Now Playing integration (synthetic player, no audio)
        if: runner.os == 'macOS'
        env:
          TOKENDOCK_TEST_DISPLAY: isolated
        run: python3 desktop/native/mac-media-check.py artifacts/desktop/TokenDock.dll
      - name: Native Linux accessibility (AT-SPI, isolated session)
        if: runner.os == 'Linux'
        env:
          TOKENDOCK_TEST_DISPLAY: isolated
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 desktop/native/accessibility-check.py artifacts/desktop/TokenDock.dll
      - name: Native macOS accessibility when permission is available
        if: runner.os == 'macOS'
        env:
          TOKENDOCK_TEST_DISPLAY: isolated
        run: |
          python3 desktop/native/accessibility-check.py artifacts/desktop/TokenDock.dll || {
            result=$?
            if [ "$result" = 77 ]; then
              echo '::warning::Native macOS accessibility remains unverified: runner denies AX client permission.'
            else
              exit "$result"
            fi
          }
      - name: Native X11 clipboard (isolated virtual display)
        if: runner.os == 'Linux'
        env:
          TOKENDOCK_TEST_DISPLAY: isolated
        run: xvfb-run -a dotnet artifacts/desktop/TokenDock.dll --native-clipboard-check
      - name: Native cross-process drag/drop (isolated X11)
        if: runner.os == 'Linux'
        env:
          TOKENDOCK_TEST_DISPLAY: isolated
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 desktop/native/drag-check.py artifacts/desktop/TokenDock.dll
      - name: Native macOS clipboard (disposable CI desktop)
        if: runner.os == 'macOS'
        env:
          TOKENDOCK_TEST_DISPLAY: isolated
        run: dotnet artifacts/desktop/TokenDock.dll --native-clipboard-check
      - name: Native macOS drag/drop when event permission is available
        if: runner.os == 'macOS'
        env:
          TOKENDOCK_TEST_DISPLAY: isolated
        run: |
          python3 desktop/native/drag-check.py artifacts/desktop/TokenDock.dll || {
            result=$?
            if [ "$result" = 77 ]; then
              echo '::warning::macOS native drag/drop remains unverified: this runner denies event injection.'
            else
              exit "$result"
            fi
          }
      - name: Compile Apple Music adapter without launching the player
        if: runner.os == 'macOS'
        run: osacompile -o artifacts/music.scpt desktop/native/music-apple.applescript
      - name: Validate development packaging (not uploaded or released)
        run: bash scripts/package-native.sh "${{ runner.os == 'macOS' && 'osx' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}"
      - name: Validate install, reinstall and removal (disposable CI only)
        env:
          TOKENDOCK_TEST_DISPLAY: isolated
        run: bash scripts/check-installers.sh "${{ runner.os == 'macOS' && 'osx' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}"
      - name: Keep validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-renders-${{ matrix.os }}
          path: |
            artifacts/desktop-renders/*.png
            artifacts/performance.json
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create synthetic SQLite input
        run: python portable/create_fixture.py artifacts/fixture.db
      - name: Check real OS adapters and shared logic
        run: dotnet run --project portable -c Release -- --check artifacts/fixture.db
      # Intentionally no packaging, release, or upload: core checks do not prove
      # desktop/module parity. Full native validation is required for publication.
