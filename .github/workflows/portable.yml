name: Native port integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create synthetic SQLite input
        run: python portable/create_fixture.py artifacts/fixture.db
      - name: Check real OS adapters and shared logic
        run: dotnet run --project portable -c Release -- --check artifacts/fixture.db
      # Intentionally no packaging, release, or upload: core checks do not prove
      # desktop/module parity. Full native validation is required for publication.
